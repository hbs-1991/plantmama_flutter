openapi: 3.1.0
info:
  title: PlantMama Store API - Regions
  description: |
    Available regions and region settings endpoints.

    ## Region Support
    PlantMama operates in multiple regions. Use the region code in the
    `X-Region-Code` header for region-specific requests.

    Region affects:
    - Product availability
    - Pricing
    - Delivery options
    - Payment methods

  version: 1.0.0
  contact:
    name: PlantMama Support
    email: support@plantmama.com

servers:
  - url: https://api.plantmama.com/api/v1
    description: Production API
  - url: http://localhost:8000/api/v1
    description: Development API (local)

paths:
  /regions:
    get:
      tags:
        - Regions
      summary: List all available regions
      description: |
        Get all regions where PlantMama operates.

        Use the region code in the `X-Region-Code` header for region-specific requests.
      operationId: listRegions
      parameters:
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: is_active
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Regions retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '../_common/schemas.yaml#/components/schemas/Region'

  /regions/current:
    get:
      tags:
        - Regions
      summary: Get current region
      description: |
        Get the current region based on the X-Region-Code header.
        If no header is provided, returns the default region.
      operationId: getCurrentRegion
      parameters:
        - name: X-Region-Code
          in: header
          schema:
            type: string
            default: TM
      responses:
        '200':
          description: Current region retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '../_common/schemas.yaml#/components/schemas/Region'

components:
  securitySchemes:
    BearerAuth:
      $ref: '../_common/schemas.yaml#/components/securitySchemes/BearerAuth'

tags:
  - name: Regions
    description: Available regions and region settings
