openapi: 3.1.0
info:
  title: PlantMama Store API - Search
  description: |
    Global search functionality endpoints.

    ## Search Features
    - Search across products, collections, and categories
    - Results grouped by type with ranking
    - Region-specific results via X-Region-Code header

  version: 1.0.0
  contact:
    name: PlantMama Support
    email: support@plantmama.com

servers:
  - url: https://api.plantmama.com/api/v1
    description: Production API
  - url: http://localhost:8000/api/v1
    description: Development API (local)

paths:
  /search:
    get:
      tags:
        - Search
      summary: Global search
      description: |
        Search across products, collections, and categories.

        Returns results grouped by type with ranking.
      operationId: globalSearch
      parameters:
        - name: q
          in: query
          required: true
          description: Search query
          schema:
            type: string
            minLength: 2
        - name: type
          in: query
          description: Filter by result type
          schema:
            type: string
            enum: [products, collections, categories, all]
            default: all
        - name: limit
          in: query
          description: Number of results per type
          schema:
            type: integer
            default: 10
        - name: X-Region-Code
          in: header
          schema:
            type: string
            default: TM
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      products:
                        type: array
                        items:
                          $ref: '../_common/schemas.yaml#/components/schemas/ProductListItem'
                      collections:
                        type: array
                        items:
                          type: object
                      categories:
                        type: array
                        items:
                          type: object
        '400':
          description: Invalid search query

components:
  securitySchemes:
    BearerAuth:
      $ref: '../_common/schemas.yaml#/components/securitySchemes/BearerAuth'

tags:
  - name: Search
    description: Global search functionality
