openapi: 3.1.0
info:
  title: PlantMama Store API - User Profile
  description: |
    User account management and addresses endpoints.

    ## Features
    - View and update profile information
    - Manage delivery addresses
    - Set default address for checkout

  version: 1.0.0
  contact:
    name: PlantMama Support
    email: support@plantmama.com

servers:
  - url: https://api.plantmama.com/api/v1
    description: Production API
  - url: http://localhost:8000/api/v1
    description: Development API (local)

paths:
  /users/me:
    get:
      tags:
        - User Profile
      summary: Get current user profile
      description: Retrieve the authenticated user's profile information
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '../_common/schemas.yaml#/components/schemas/SuccessResponse_User'
        '401':
          description: Unauthorized

    patch:
      tags:
        - User Profile
      summary: Update user profile
      description: |
        Update user profile information.

        **Updatable fields:**
        - full_name
        - phone
        - (Other fields via specific endpoints)
      operationId: updateUserProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  minLength: 1
                  maxLength: 255
                phone:
                  type: string
                  minLength: 1
                  maxLength: 20
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '../_common/schemas.yaml#/components/schemas/SuccessResponse_User'
        '401':
          description: Unauthorized
        '422':
          description: Validation error

  /users/me/addresses:
    get:
      tags:
        - User Profile
      summary: Get user's addresses
      description: Retrieve all saved delivery addresses for the user
      operationId: getUserAddresses
      security:
        - BearerAuth: []
      parameters:
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Addresses retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '../_common/schemas.yaml#/components/schemas/Address'

    post:
      tags:
        - User Profile
      summary: Add new delivery address
      description: Save a new delivery address for the user
      operationId: addUserAddress
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../_common/schemas.yaml#/components/schemas/AddressCreate'
      responses:
        '201':
          description: Address created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '../_common/schemas.yaml#/components/schemas/Address'
        '422':
          description: Validation error

  /users/me/addresses/{address_id}:
    patch:
      tags:
        - User Profile
      summary: Update delivery address
      operationId: updateUserAddress
      security:
        - BearerAuth: []
      parameters:
        - name: address_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                phone:
                  type: string
                address_line1:
                  type: string
                city:
                  type: string
                postal_code:
                  type: string
                is_default:
                  type: boolean
      responses:
        '200':
          description: Address updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '../_common/schemas.yaml#/components/schemas/Address'

    delete:
      tags:
        - User Profile
      summary: Delete delivery address
      operationId: deleteUserAddress
      security:
        - BearerAuth: []
      parameters:
        - name: address_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Address deleted
          content:
            application/json:
              schema:
                $ref: '../_common/schemas.yaml#/components/schemas/MessageResponse'
        '404':
          description: Address not found

components:
  securitySchemes:
    BearerAuth:
      $ref: '../_common/schemas.yaml#/components/securitySchemes/BearerAuth'

tags:
  - name: User Profile
    description: User account management and addresses
